services:
  - type: web
    name: sms-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep a single worker: the background send queue runs inside that process.
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SMS_PROVIDER
        value: log            # "log" = test mode (nothing is sent); "twilio" = real sending
      - key: API_KEY
        sync: false
      - key: INBOUND_TOKEN
        sync: false
      - key: PER_NUMBER_DAILY_LIMIT
        value: "3"
      - key: GLOBAL_DAILY_LIMIT
        value: "20"
      - key: MAX_BULK
        value: "50"
      - key: SEND_RATE_PER_SEC
        value: "1"
      - key: DB_PATH
        value: /tmp/sms.db
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
